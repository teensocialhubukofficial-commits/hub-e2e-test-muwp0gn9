name: Hub External Deploy
on:
  workflow_dispatch:
    inputs:
      source_url: { description: "Signed URL to deployment artifact ZIP", required: true, type: string }
      source_hash: { description: "SHA-256 of deployment artifact", required: true, type: string }
      expected_commit_sha: { description: "Expected commit SHA", required: true, type: string }
      callback_url: { description: "Hub deployment callback endpoint", required: true, type: string }
      deploy_token: { description: "Per-deployment auth token", required: true, type: string }
      deployment_id: { description: "Hub Deployment id", required: true, type: string }
      environment: { description: "Disposable deployment environment", required: false, type: string, default: "hub-disposable-test" }
      fail_deployment: { description: "Force a deployment failure (test)", required: false, type: boolean, default: false }
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify artifact
        run: |
          set -euo pipefail
          curl -fsSL "${{ inputs.source_url }}" -o source.zip
          echo "${{ inputs.source_hash }}  source.zip" | sha256sum -c -
          if [ "${{ github.sha }}" != "${{ inputs.expected_commit_sha }}" ]; then
            echo "Commit mismatch: github.sha=${{ github.sha }} expected=${{ inputs.expected_commit_sha }}" >&2
            exit 1
          fi
      - name: Create GitHub deployment
        id: ghdeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n --arg s "${{ inputs.source_hash }}" --arg d "${{ inputs.deployment_id }}" '{source_hash:$s, hub_deployment_id:$d}')
          DEPLOY=$(curl -fsSL -X POST "https://api.github.com/repos/${{ github.repository }}/deployments"             -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "User-Agent: base44-project-hub"             -d "$(jq -n --arg ref "${{ github.sha }}" --arg env "${{ inputs.environment }}" --arg desc "Hub disposable deployment" --argjson payload "$PAYLOAD" '{ref:$ref, environment:$env, description:$desc, payload:$payload, required_contexts:[]}')")
          DEPLOY_ID=$(echo "$DEPLOY" | jq -r .id)
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          curl -fsSL -X POST "https://api.github.com/repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses"             -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "User-Agent: base44-project-hub"             -d "$(jq -n --arg s "in_progress" --arg desc "Deploying" --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{state:$s, description:$desc, target_url:$url}')"
      - name: Perform disposable deployment
        id: perform
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ inputs.fail_deployment }}" = "true" ]; then
            echo "Deliberate deployment failure (test)"
            exit 1
          fi
          rm -rf deployed_artifact && mkdir -p deployed_artifact
          unzip -q source.zip -d deployed_artifact
          echo "Disposable deployment of $(find deployed_artifact -type f | wc -l) files completed."
      - name: Report deployment result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_ID="${{ steps.ghdeploy.outputs.deploy_id }}"
          OUTCOME="${{ steps.perform.outcome }}"
          RESULT="deployment_failed"
          if [ "$OUTCOME" = "success" ]; then RESULT="deployed"; fi
          if [ -n "$DEPLOY_ID" ]; then
            STATE="success"; [ "$RESULT" = "deployment_failed" ] && STATE="failure"
            curl -fsSL -X POST "https://api.github.com/repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses"               -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "User-Agent: base44-project-hub"               -d "$(jq -n --arg s "$STATE" --arg desc "Deployment $RESULT" --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{state:$s, description:$desc, target_url:$url}')"
          fi
          DEPLOY_URL=""
          if [ -n "$DEPLOY_ID" ]; then DEPLOY_URL="https://github.com/${{ github.repository }}/deployments/$DEPLOY_ID"; fi
          jq -n --arg deployment_id "${{ inputs.deployment_id }}" --arg source_hash "${{ inputs.source_hash }}" --arg commit_sha "${{ github.sha }}" --arg run_id "${{ github.run_id }}" --arg result "$RESULT" --arg external_deployment_id "$DEPLOY_ID" --arg verification_url "$DEPLOY_URL" --arg environment "${{ inputs.environment }}" '{deployment_id:$deployment_id, source_hash:$source_hash, commit_sha:$commit_sha, run_id:$run_id, result:$result, external_deployment_id:$external_deployment_id, verification_url:$verification_url, environment:$environment}' > payload.json
          curl -fsSL -X POST "${{ inputs.callback_url }}" -H "Authorization: Bearer ${{ inputs.deploy_token }}" -H "Content-Type: application/json" --data-binary @payload.json
