name: Hub Disposable Deploy
on:
  workflow_dispatch:
    inputs:
      deployment_id:  { description: "Hub Deployment id", required: true, type: string }
      source_url:     { description: "Signed URL to source ZIP", required: true, type: string }
      source_hash:    { description: "SHA-256 of source artifact", required: true, type: string }
      commit_sha:     { description: "Expected commit SHA", required: true, type: string }
      callback_url:   { description: "Hub callback endpoint", required: true, type: string }
      deploy_token:   { description: "Per-deployment auth token", required: true, type: string }
      target:         { description: "Deployment target", required: true, type: string }
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hub-disposable-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      SOURCE_URL: ${{ inputs.source_url }}
      SOURCE_HASH: ${{ inputs.source_hash }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      DEPLOY_TOKEN: ${{ inputs.deploy_token }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Download and verify source
        id: dl
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL "$SOURCE_URL" -o source.zip
          echo "$SOURCE_HASH  source.zip" | sha256sum -c -
      - name: Build marker page
        id: build
        if: ${{ steps.dl.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p site
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > site/index.html <<HTMLEOF
          <!doctype html><html><head><meta charset="utf-8"><title>Hub Disposable Deployment</title></head>
          <body style="font-family:monospace;padding:2rem">
          <h1>Disposable Deployment Marker</h1>
          <p>Genuine disposable deployment target produced by the Project Hub deployment gate.</p>
          <pre>
          deployment_id: $DEPLOYMENT_ID
          commit_sha: $COMMIT_SHA
          source_hash: $SOURCE_HASH
          target: $TARGET
          deployed_at: $TS
          </pre>
          </body></html>
          HTMLEOF
      - name: Setup Pages
        id: pagescfg
        if: ${{ steps.dl.outcome == 'success' && steps.build.outcome == 'success' }}
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        id: upload
        if: ${{ steps.dl.outcome == 'success' && steps.build.outcome == 'success' && steps.pagescfg.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deploy
        if: ${{ steps.dl.outcome == 'success' && steps.build.outcome == 'success' && steps.pagescfg.outcome == 'success' && steps.upload.outcome == 'success' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Report awaiting verification
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          PAGE_URL="${{ steps.deploy.outputs.page_url }}"
          jq -n --arg d "$DEPLOYMENT_ID" --arg h "$SOURCE_HASH" --arg c "$COMMIT_SHA" --arg r "${{ github.run_id }}" --arg u "$PAGE_URL" --arg s "awaiting_verification" '{deployment_id:$d,source_hash:$h,commit_sha:$c,run_id:$r,verification_url:$u,stage:$s}' > p.json
          curl -fsSL -X POST "$CALLBACK_URL" -H "Authorization: Bearer $DEPLOY_TOKEN" -H "Content-Type: application/json" --data-binary @p.json
      - name: Verify live deployment
        id: verify
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        run: |
          PAGE_URL="${{ steps.deploy.outputs.page_url }}"
          for i in $(seq 1 30); do
            BODY=$(curl -fsSL "$PAGE_URL" 2>/dev/null || true)
            if echo "$BODY" | grep -q "$DEPLOYMENT_ID" && echo "$BODY" | grep -q "$COMMIT_SHA"; then
              echo "verified=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Report final result
        if: ${{ always() }}
        run: |
          set -euo pipefail
          STAGE="deploy_failed"
          if [ "${{ steps.dl.outcome }}" != "success" ]; then STAGE="source_verify_failed";
          elif [ "${{ steps.build.outcome }}" != "success" ]; then STAGE="deploy_failed";
          elif [ "${{ steps.pagescfg.outcome }}" != "success" ]; then STAGE="deploy_failed";
          elif [ "${{ steps.upload.outcome }}" != "success" ]; then STAGE="deploy_failed";
          elif [ "${{ steps.deploy.outcome }}" != "success" ]; then STAGE="deploy_failed";
          elif [ "${{ steps.verify.outcome }}" == "success" ]; then STAGE="verified";
          else STAGE="verification_failed"; fi
          PAGE_URL="${{ steps.deploy.outputs.page_url }}"
          jq -n --arg d "$DEPLOYMENT_ID" --arg h "$SOURCE_HASH" --arg c "$COMMIT_SHA" --arg r "${{ github.run_id }}" --arg u "$PAGE_URL" --arg s "$STAGE" '{deployment_id:$d,source_hash:$h,commit_sha:$c,run_id:$r,verification_url:$u,stage:$s}' > p.json
          curl -fsSL -X POST "$CALLBACK_URL" -H "Authorization: Bearer $DEPLOY_TOKEN" -H "Content-Type: application/json" --data-binary @p.json
